    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fde68a 0%, #fbcfe8 25%, #bae6fd 50%, #bbf7d0 75%, #ddd6fe 100%);
            min-height: 100vh;
            user-select: none;
        }
        .arab { font-family: 'Amiri', serif; }
        .hide { display: none !important; }
        .pop { animation: pop .45s cubic-bezier(.175,.885,.32,1.275); }
        @keyframes pop { 0% { transform: scale(.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .shake { animation: shake .45s; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
        .opt { transition: transform .12s, filter .12s; }
        .opt:active { transform: scale(.94); }
        .opt:disabled { cursor: default; }
        .good { background: #22c55e !important; }
        .bad { background: #ef4444 !important; }
        .gender-btn.selected { border-color: #10b981; background: #ecfdf5; box-shadow: 0 0 0 4px #6ee7b7; }
        .avatar-ring { border: 4px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
        #timebar { transition: width 1s linear; }
        .confetti { position: fixed; top: -30px; pointer-events: none; font-size: 24px; z-index: 99; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

<div id="arab-banner" class="hide fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-gradient-to-r from-emerald-400 to-teal-500 text-white px-6 py-3 rounded-2xl shadow-2xl pop">
    <span class="arab text-3xl font-bold">الحمد لله</span>
</div>

<div class="w-full max-w-md bg-white/90 rounded-3xl shadow-2xl border-4 border-yellow-300 p-5 relative overflow-hidden">
    <div class="text-center mb-3">
        <h1 class="text-2xl font-extrabold bg-gradient-to-r from-rose-500 via-amber-500 to-sky-500 bg-clip-text text-transparent">Tebak Harakat 🎨</h1>
        <p class="text-sm text-gray-500">Kenali tanda baca huruf hijaiyah</p>
    </div>

    <!-- Nama & jenis kelamin -->
    <div id="name" class="hide text-center py-2">
        <div class="text-5xl mb-2">👋</div>
        <h2 class="text-2xl font-extrabold text-rose-500 mb-1">Assalamu'alaikum!</h2>
        <p class="text-gray-500 text-sm mb-4">Isi nama dan pilih jenis kelamin dulu ya</p>
        <div class="grid grid-cols-2 gap-3 mb-4">
            <button type="button" id="gender-L" onclick="pickGender('L')" class="gender-btn border-2 border-sky-300 rounded-2xl p-3 bg-white transition active:scale-95">
                <div id="av-L" class="mx-auto" style="width:64px;height:64px"></div>
                <div class="font-bold text-sm text-sky-900 mt-2">Laki-laki</div>
            </button>
            <button type="button" id="gender-P" onclick="pickGender('P')" class="gender-btn border-2 border-sky-300 rounded-2xl p-3 bg-white transition active:scale-95">
                <div id="av-P" class="mx-auto" style="width:64px;height:64px"></div>
                <div class="font-bold text-sm text-sky-900 mt-2">Perempuan</div>
            </button>
        </div>
        <input id="player-name" type="text" maxlength="20" placeholder="Contoh: Ahmad" onkeydown="if(event.key==='Enter')submitName()"

    // ============ SUARA ============
    let ac = null;
    function audio() {
        if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
        if (ac.state === 'suspended') ac.resume();
        return ac;
    }
    function tone(freq, dur, type = 'sine', vol = 0.2, when = 0) {
        const a = audio();
        const t = a.currentTime + when;
        const o = a.createOscillator(), g = a.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(g).connect(a.destination);
        o.start(t); o.stop(t + dur + 0.02);
    }
    function sfxClick() { tone(760, 0.06, 'triangle', 0.15); }
    function sfxCorrect() {
        [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'triangle', 0.25, i * 0.09));
    }
    function sfxWrong() {
        tone(220, 0.2, 'sawtooth', 0.12);
        tone(165, 0.3, 'sawtooth', 0.12, 0.16);
    }
    function sfxTick() { tone(900, 0.04, 'square', 0.05); }

    // Klip rekaman (tepuk tangan & Alhamdulillah)
    const clipCache = {};
    function getClip(src) {
        if (!clipCache[src]) clipCache[src] = new Audio(src);
        return clipCache[src];
    }
    function playClip(src, fallback) {
        try {
            const a = getClip(src);
            a.currentTime = 0;
            const p = a.play();
            if (p && p.catch) p.catch(() => fallback && fallback());
        } catch (e) {
            if (fallback) fallback();
        }
    }
    function unlockClips() {
        [SND.alhamdulillah, SND.tepuk].forEach(src => {
            const a = getClip(src);
            a.muted = true;
            const p = a.play();
            if (p && p.then) p.then(() => { a.pause(); a.muted = false; }).catch(() => { a.muted = false; });
        });
    }
    function chantAlhamdulillah() {
        [392, 440, 494, 523, 494].forEach((f, i) => tone(f, 0.45, 'triangle', 0.3, i * 0.32));
    }
    function celebrate() {
        const text = document.getElementById('arab-banner');
        text.classList.remove('hide');
        setTimeout(() => text.classList.add('hide'), 2500);
        playClip(SND.tepuk);
        setTimeout(() => playClip(SND.alhamdulillah, chantAlhamdulillah), 500);
    }

    // Confetti warna-warni
    function confetti(n = 26) {
        const layer = document.getElementById('confetti-layer');
        const icons = ['🎉', '⭐', '✨', '🌈', '🎈', '💖'];
        for (let i = 0; i < n; i++) {
            const s = document.createElement('span');
            s.className = 'confetti';
            s.textContent = icons[rand(icons.length)];
            s.style.left = (Math.random() * 100) + 'vw';
            layer.appendChild(s);
            s.animate([
                { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                { transform: `translateY(${innerHeight + 80}px) rotate(${rand(720)}deg)`, opacity: 0.2 }
            ], { duration: 1500 + rand(1200), easing: 'ease-in' }).onfinish = () => s.remove();
        }
    }

                <rect width="64" height="64" fill="${bg}"/>
                <path d="M10 64 Q32 40 54 64 Z" fill="#3b82f6"/>
                <rect x="28" y="44" width="8" height="8" fill="${skin}"/>
                <ellipse cx="32" cy="34" rx="12" ry="13" fill="${skin}"/>
                ${extra}
                <circle cx="27" cy="36" r="1.6" fill="${ink}"/>
                <circle cx="37" cy="36" r="1.6" fill="${ink}"/>
                <path d="M27 42 Q32 46 37 42" stroke="${ink}" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            </svg>`;
        }
        // hijab hijau tosca menutupi kepala dan bahu
        return `<svg viewBox="0 0 64 64" style="display:block;width:100%;height:100%">
            <rect width="64" height="64" fill="${bg}"/>
            <path d="M8 64 Q10 38 22 30 Q32 20 42 30 Q54 38 56 64 Z" fill="#0f766e"/>
            <rect x="28" y="44" width="8" height="8" fill="${skin}"/>
            <ellipse cx="32" cy="36" rx="10.5" ry="12" fill="${skin}"/>
            <path d="M21 36 Q21 22 32 21 Q43 22 43 36 Q41 27 32 26 Q23 27 21 36 Z" fill="#0f766e"/>
            <circle cx="28" cy="37" r="1.5" fill="${ink}"/>
            <circle cx="36" cy="37" r="1.5" fill="${ink}"/>
            <path d="M28.5 43 Q32 46 35.5 43" stroke="${ink}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>`;
    }

    function renderGenderAvatars() {
        document.getElementById('av-L').innerHTML = avatarSVG('L');
        document.getElementById('av-P').innerHTML = avatarSVG('P');
    }
    function renderPlayerChip() {
        const chip = document.getElementById('player-chip');
        chip.innerHTML = '';
        const av = document.createElement('div');
        av.className = 'rounded-full overflow-hidden border-2 border-white shadow';
        av.style.cssText = 'width:40px;height:40px';
        av.innerHTML = avatarSVG(playerGender);
        const nm = document.createElement('span');
        nm.className = 'font-extrabold text-indigo-700';
        nm.textContent = playerName;
        chip.appendChild(av);
        chip.appendChild(nm);
    }

    // ============ NAMA ============
    function pickGender(g) {
        playerGender = g;
        document.getElementById('gender-L').classList.toggle('selected', g === 'L');
        document.getElementById('gender-P').classList.toggle('selected', g === 'P');
    }
    function showNameScreen() {
        renderGenderAvatars();
        show('name');
        setTimeout(() => document.getElementById('player-name').focus(), 50);
    }
    function submitName() {
        const v = document.getElementById('player-name').value.trim();
        if (!v || !playerGender) {
            document.getElementById('name-error').classList.remove('hide');
            return;
        }
        playerName = v;
        loadProgress();
        audio();
        unlockClips();
        showMenu();
    }

    // ============ MENU ============
    function showMenu() {
        stopTimer();
        const menu = document.getElementById('menu');
        menu.innerHTML = '';
        const greet = document.createElement('p');
        greet.className = 'text-center text-sm font-bold text-indigo-700 mb-1';
        greet.textContent = 'Halo, ' + playerName + '! Pilih level:';
        menu.appendChild(greet);
        LEVELS.forEach((lv, i) => {
            const locked = i > unlockedLevel;
            const btn = document.createElement('button');
            btn.className = `w-full ${LV_CLS[i]} border-2 p-4 rounded-2xl flex items-center justify-between shadow-md transition active:scale-95`;
            btn.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 ${LV_BADGE[i]} text-white rounded-xl flex items-center justify-center font-extrabold text-lg shadow">${i + 1}</div>
                    <div class="text-left">
                        <div class="font-extrabold text-gray-800">${lv.name}</div>
                        <div class="text-xs text-gray-600">${lv.desc}</div>
                    </div>
                </div>
                <span class="whitespace-nowrap text-indigo-600 font-extrabold text-sm bg-white px-3 py-1.5 rounded-xl">${locked ? '🔒 Terkunci' : 'Main ›'}</span>`;
            btn.disabled = locked;
            if (locked) btn.classList.add('opacity-50', 'cursor-not-allowed');
            btn.onclick = () => { if (!locked) startLevel(i); };
            menu.appendChild(btn);
        });
        show('menu');
    }

    // ============ PERMAINAN ============
    function buildQuestions(cfg) {
        const out = [];
        let prev = -1;
        for (let i = 0; i < cfg.n; i++) {
            let k;
            do { k = cfg.kinds[rand(cfg.kinds.length)]; } while (cfg.kinds.length > 1 && k === prev);
            prev = k;
            out.push({ letter: LETTERS[rand(cfg.letters)], kind: k });
        }
        return out;
    }

    function startLevel(i) {
        audio();
        unlockClips();
        stopTimer();
        cur = i;
        qs = buildQuestions(LEVELS[i]);
        qi = 0;
        mistakes = 0;
        document.getElementById('level-tag').textContent = LEVELS[i].name;
        renderPlayerChip();
        show('game');
        renderQuestion();
    }

    function syllable(q) { return q.letter.h + HARAKAT[q.kind].mark; }
    function latinSound(q) { return q.letter.c + HARAKAT[q.kind].sound; }

    function updateHud() {
        const n = qs.length;
        document.getElementById('qcount').textContent = `Soal ${Math.min(qi + 1, n)} / ${n}`;
        document.getElementById('mistake-count').textContent = `❌ Salah: ${mistakes}`;
        document.getElementById('progress').style.width = (qi / n * 100) + '%';
    }

    function renderQuestion() {
        const cfg = LEVELS[cur];
        const q = qs[qi];
        busy = false;
        document.getElementById('feedback').textContent = '';
        document.getElementById('qletter').textContent = q.letter.l;
        document.getElementById('qsyl').textContent = syllable(q);
        document.getElementById('qcard').classList.remove('shake');
        updateHud();

        const box = document.getElementById('options');
        box.innerHTML = '';
        shuffle(cfg.kinds).forEach(k => {
            const H = HARAKAT[k];
            const b = document.createElement('button');
            b.className = `opt ${H.cls} text-white font-extrabold rounded-2xl py-4 px-2 shadow-lg`;
            b.innerHTML = `<div class="text-3xl">${H.emoji}</div>
                <div class="text-base sm:text-lg">${H.name}</div>
                <div class="text-xs opacity-90">${H.sound ? 'bunyi: ' + H.sound : 'diam, tanpa vokal'}</div>`;
            b.onclick = () => answer(k, b);
            box.appendChild(b);
        });

        stopTimer();
        if (cfg.timer > 0) {
            timeLeft = cfg.timer;
            document.getElementById('timerwrap').classList.remove('hide');
            setTimebar();
            timerId = setInterval(tickTimer, 1000);
        } else {
            document.getElementById('timerwrap').classList.add('hide');
        }
    }

    function setTimebar() {
        const pct = Math.max(timeLeft, 0) / LEVELS[cur].timer * 100;
        document.getElementById('timebar').style.width = pct + '%';
    }
    function tickTimer() {
        timeLeft--;
        setTimebar();
        if (timeLeft > 0) { sfxTick(); return; }
        // waktu habis: dihitung salah, tampilkan jawaban, lanjut
        stopTimer();
        busy = true;
        mistakes++;
        updateHud();
        sfxWrong();
        const q = qs[qi];
        document.getElementById('feedback').innerHTML = `<span class="text-rose-500">Waktu habis! Jawabannya: ${HARAKAT[q.kind].name}</span>`;
        document.getElementById('qcard').classList.add('shake');
        document.querySelectorAll('#options button').forEach(b => {
            b.disabled = true;
            if (b.textContent.includes(HARAKAT[q.kind].name)) b.classList.add('good');
        });
        setTimeout(nextQuestion, 1500);
    }
    function stopTimer() {
        if (timerId) clearInterval(timerId);
        timerId = null;
    }

    function answer(k, btn) {
        if (busy) return;
        const q = qs[qi];
        const fb = document.getElementById('feedback');
        if (k === q.kind) {
            busy = true;
            stopTimer();
            btn.classList.add('good');
            sfxCorrect();
            confetti(14);
            fb.innerHTML = `<span class="text-emerald-600">Benar! Bunyinya "${latinSound(q)}" 🎉</span>`;
            document.querySelectorAll('#options button').forEach(b => b.disabled = true);
            setTimeout(nextQuestion, 1000);
        } else {
            mistakes++;
            updateHud();
            btn.classList.add('bad');
            btn.disabled = true;
            sfxWrong();
            document.getElementById('qcard').classList.remove('shake');
            void document.getElementById('qcard').offsetWidth;
            document.getElementById('qcard').classList.add('shake');
            fb.innerHTML = `<span class="text-amber-600">Coba lagi ya, kamu pasti bisa! 💪</span>`;
        }
    }

    function nextQuestion() {
        qi++;
        if (qi >= qs.length) levelDone();
        else renderQuestion();
    }

    // ============ HASIL ============
    function setPanel(emoji, title, msg, stars, buttons) {
        document.getElementById('win-avatar').innerHTML = avatarSVG(playerGender);
        const e = document.getElementById('win-emoji');
        e.textContent = emoji;
        e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop');
        document.getElementById('win-stars').textContent = stars;
        document.getElementById('win-title').textContent = title;
        document.getElementById('win-msg').textContent = msg;
        const actions = document.getElementById('actions');
        actions.innerHTML = '';
        buttons.forEach(b => {
            const btn = document.createElement('button');
            btn.className = `w-full ${b.cls} text-white font-extrabold py-3 rounded-2xl shadow-lg active:scale-95 transition`;
            btn.textContent = b.label;
            btn.onclick = b.action;
            actions.appendChild(btn);
        });
        show('win');
    }

    function levelDone() {
        stopTimer();
        unlockedLevel = Math.max(unlockedLevel, Math.min(cur + 1, LEVELS.length - 1));
        saveProgress();
        const stars = mistakes === 0 ? '⭐⭐⭐' : mistakes <= 2 ? '⭐⭐☆' : '⭐☆☆';
        const isLast = cur + 1 >= LEVELS.length;
        confetti(40);
        celebrate();

        if (isLast) {
            setPanel('🏆🎉', `MasyaAllah, ${playerName}!`,
                `Alhamdulillah, ${playerName} juara semua level dengan ${mistakes} kesalahan.`, stars,
                [
                    { label: 'Main Lagi dari Level 1', cls: 'bg-gradient-to-r from-sky-400 to-blue-500', action: () => startLevel(0) },
                    { label: 'Pilih Level', cls: 'bg-gradient-to-r from-emerald-400 to-teal-500', action: showMenu }
                ]);
        } else {
            setPanel('🌟😊', `Alhamdulillah, ${playerName}!`,
                `${playerName} berhasil naik ke ${LEVELS[cur + 1].name} dengan ${mistakes} kesalahan. Siap untuk tantangan berikutnya?`, stars,
                [
                    { label: `Lanjut ke ${LEVELS[cur + 1].name} ➡`, cls: 'bg-gradient-to-r from-rose-400 to-orange-400', action: () => startLevel(cur + 1) },
                    { label: 'Ulangi level ini', cls: 'bg-gradient-to-r from-sky-400 to-blue-500', action: () => startLevel(cur) },
                    { label: 'Pilih Level', cls: 'bg-gradient-to-r from-emerald-400 to-teal-500', action: showMenu }
                ]);
        }
    }

    showNameScreen();
</script>
</body>
</html>
